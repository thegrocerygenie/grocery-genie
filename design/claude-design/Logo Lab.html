<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Grocery Genie — Logo Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --ink: #15140F;
    --ink-2: #5A554A;
    --ink-3: #8C8678;
    --paper: #F0EEE9;
    --paper-2: #E6E2D8;
    --paper-3: #F8F6F1;
    --accent: #1F7A4A;
    --rule: rgba(21,20,15,0.12);
    --rule-strong: rgba(21,20,15,0.28);
  }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }

  /* Logo Lab tiles */
  .tile { background: var(--paper-3); border: 0.5px solid var(--rule); border-radius: 6px; padding: 32px; display: flex; align-items: center; justify-content: center; min-height: 160px; }
  .tile-dark { background: var(--ink); border-color: rgba(255,255,255,0.1); }
  .tile-label { position: absolute; bottom: 12px; left: 16px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
  .tile-wrap { position: relative; }

  .lockup { display: inline-flex; align-items: center; gap: 14px; }
  .lockup .word { font-family: 'Instrument Serif', serif; font-size: 36px; line-height: 1; letter-spacing: -0.01em; }
  .lockup .word em { font-style: italic; color: var(--ink-2); }
  .lockup-dark .word { color: var(--paper); }
  .lockup-dark .word em { color: rgba(240,238,233,0.6); }

  /* App icon */
  .app-icon { width: 120px; height: 120px; border-radius: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 12px 32px -8px rgba(21,20,15,0.25); }

  /* Favicon row */
  .fav-row { display: flex; align-items: center; gap: 24px; }
  .fav-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .fav-cell .px { font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; }

  /* Section header for each direction */
  .dir-header { padding: 0 0 16px; border-bottom: 0.5px solid var(--rule); margin-bottom: 32px; max-width: 720px; }
  .dir-header .kicker { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .dir-header h2 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 44px; line-height: 1.05; letter-spacing: -0.01em; margin: 0 0 12px; }
  .dir-header p { font-size: 15px; line-height: 1.55; color: var(--ink-2); margin: 0; max-width: 560px; }

  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }
  .col-span-2 { grid-column: span 2; }
</style>
</head>
<body>

<div data-screen-label="Logo Lab" style="padding: 56px;">
  <div style="max-width: 1200px; margin: 0 auto 64px;">
    <div class="serif" style="font-size: 56px; letter-spacing: -0.01em; margin: 0 0 12px;">Grocery Genie — <em style="font-style:italic;color:var(--ink-2);">Logo Lab</em></div>
    <p style="font-size: 17px; line-height: 1.55; color: var(--ink-2); max-width: 720px; margin: 0;">Three directions, each shown as a large symbol, horizontal lockup (light + dark), rounded-square app icon, and favicon at 32 / 24 / 16&nbsp;px. All wordmarks set in Instrument Serif. Pick a winner and I'll bake it into the marketing site.</p>
  </div>
</div>

<div id="canvas-root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="logo-marks.jsx"></script>
<script type="text/babel" src="logo-lab.jsx"></script>

</body>
</html>
