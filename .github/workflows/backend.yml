# Backend checks on Postgres: the validate-backend checklist
# (.claude/commands/validate-backend.md), with pytest on the production
# database instead of in-memory SQLite. SQLite ignores FOR UPDATE, SKIP LOCKED
# and some ON CONFLICT behavior, so the Postgres-only tests (concurrency,
# locks) skip there and run only here and in `make backend-test-pg`.
name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        # The image backend/docker-compose.yml runs (pgvector for item matching).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: grocery_genie
          POSTGRES_PASSWORD: grocery_genie_dev
          POSTGRES_DB: grocery_genie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocery_genie -d grocery_genie"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        # tests/core/test_rate_limit.py skips without one.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: grocery_genie_dev
      UV_PROJECT_ENVIRONMENT: .venv
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev

      - name: Lock files match pyproject.toml
        run: ../scripts/check-backend-lock.sh

      - name: Ruff lint
        run: .venv/bin/ruff check .

      - name: Ruff format
        run: .venv/bin/ruff format --check .

      - name: Migrations reach head and match the models
        env:
          GG_DATABASE_URL: postgresql+asyncpg://grocery_genie:grocery_genie_dev@localhost:5432/grocery_genie
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check

      - name: Pytest on Postgres
        env:
          GG_TEST_DATABASE_URL: postgresql+asyncpg://grocery_genie:grocery_genie_dev@localhost:5432/gg_test
          GG_TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          psql -h localhost -U grocery_genie -d postgres -q -c "CREATE DATABASE gg_test"
          .venv/bin/pytest -p no:randomly -q
