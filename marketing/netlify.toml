[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/waitlist"
  to = "/.netlify/functions/waitlist"
  status = 200
  force = true

# Response headers live in public/_headers, which Netlify and Cloudflare Pages both read.
# The waitlist function sets Cache-Control: no-store itself.
