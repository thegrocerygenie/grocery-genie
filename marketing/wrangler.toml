# Cloudflare Worker for the marketing site (Workers with static assets).
# `name` must match the Worker's name in the dashboard, or Workers Builds fails.
# Static files come from dist/ (npm run build) and cost nothing to serve;
# only /api/* runs worker/index.js.
# Secrets are set in the dashboard or with `npx wrangler secret put NAME`, never here.
name = "grocery-genie-marketing"
main = "worker/index.js"
compatibility_date = "2026-11-01"

# Keep the runtime variables set in the dashboard (ALLOWED_ORIGIN, WAITLIST_FROM)
# when a deploy runs. Without this, `wrangler deploy` deletes them.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Workers Logs and traces. Only /api/* runs the Worker, so only waitlist
# requests are logged; static page requests aren't.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
