<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Grocery Genie — See what your grocery money actually buys">
  <rect width="1200" height="630" fill="#F0EEE9"/>

  <!-- wordmark: Leaf Drop mark + grocerygenie -->
  <g transform="translate(80,78)">
    <svg x="0" y="2" width="40" height="40" viewBox="9 9 82 82"><path d="M74.5 29.4 A32 32 0 1 0 82 50" fill="none" stroke="#1F7A4A" stroke-width="18"/><path d="M91 50 C80 36 61 36 46 53 C60 65 80 64 91 50 Z" fill="#34D17A"/></svg>
    <text x="52" y="34" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="36" letter-spacing="-1.4" fill="#15140F">grocery<tspan fill="#1F7A4A">genie</tspan></text>
  </g>

  <!-- pill -->
  <g transform="translate(80,160)">
    <rect width="252" height="34" rx="17" fill="#E6E2D8"/>
    <circle cx="22" cy="17" r="4" fill="#1F7A4A"/>
    <text x="38" y="22" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="1.8" fill="#4F4B41">EARLY ACCESS · IPHONE</text>
  </g>

  <!-- headline -->
  <text font-family="'Instrument Serif', Georgia, serif" font-size="84" fill="#15140F" letter-spacing="-1.5">
    <tspan x="80" y="300">See what your</tspan>
    <tspan x="80" y="384">grocery money</tspan>
    <tspan x="80" y="468" font-style="italic" fill="#4F4B41">actually buys.</tspan>
  </text>
  <text x="80" y="540" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#4F4B41">Scan a receipt. Every item sorted, budget updated.</text>

  <!-- phone: categorized receipt + budget ring -->
  <g transform="translate(800,70)">
    <rect width="300" height="500" rx="42" fill="#1C1C1E"/>
    <rect x="5" y="5" width="290" height="490" rx="38" fill="#F2F2F7"/>
    <rect x="111" y="14" width="78" height="22" rx="11" fill="#000"/>
    <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
      <text x="28" y="82" font-size="17" font-weight="600" fill="#000">Trader Joe's</text>
      <text x="28" y="102" font-size="13" fill="#3C3C43" fill-opacity="0.6">Nov 21 · 7 items</text>
      <text x="272" y="90" font-size="20" font-weight="700" fill="#000" text-anchor="end">$48.20</text>

      <rect x="20" y="120" width="260" height="196" rx="16" fill="#fff"/>
      <g font-size="13" fill="#000">
        <text x="34" y="148">Chicken thighs</text><text x="266" y="148" text-anchor="end">11.48</text>
        <text x="34" y="180">Strawberries</text><text x="266" y="180" text-anchor="end">4.99</text>
        <text x="34" y="212">Paper towels</text><text x="266" y="212" text-anchor="end">8.99</text>
        <text x="34" y="244">Tortilla chips</text><text x="266" y="244" text-anchor="end">4.29</text>
        <text x="34" y="276">Cat litter</text><text x="266" y="276" text-anchor="end">9.17</text>
      </g>
      <g font-size="10" font-weight="600" fill="#1F7A4A">
        <rect x="150" y="136" width="70" height="17" rx="8.5" fill="#1F7A4A" fill-opacity="0.12"/><text x="185" y="148" text-anchor="middle">Groceries</text>
        <rect x="150" y="168" width="70" height="17" rx="8.5" fill="#1F7A4A" fill-opacity="0.12"/><text x="185" y="180" text-anchor="middle">Groceries</text>
        <rect x="150" y="200" width="70" height="17" rx="8.5" fill="#1F7A4A" fill-opacity="0.12"/><text x="185" y="212" text-anchor="middle">Household</text>
        <rect x="134" y="232" width="86" height="17" rx="8.5" fill="#1F7A4A" fill-opacity="0.12"/><text x="177" y="244" text-anchor="middle">Snacks &amp; Treats</text>
        <rect x="176" y="264" width="44" height="17" rx="8.5" fill="#1F7A4A" fill-opacity="0.12"/><text x="198" y="276" text-anchor="middle">Pet</text>
      </g>
      <g stroke="#3C3C43" stroke-opacity="0.29" stroke-width="0.5">
        <line x1="34" y1="162" x2="280" y2="162"/><line x1="34" y1="194" x2="280" y2="194"/><line x1="34" y1="226" x2="280" y2="226"/><line x1="34" y1="258" x2="280" y2="258"/>
      </g>

      <rect x="20" y="332" width="260" height="104" rx="16" fill="#fff"/>
      <g transform="translate(72,384) rotate(-90)">
        <circle r="32" fill="none" stroke="#3C3C43" stroke-opacity="0.29" stroke-width="10"/>
        <circle r="32" fill="none" stroke="#1F7A4A" stroke-width="10" stroke-linecap="round" stroke-dasharray="160.9 201.1"/>
      </g>
      <text x="122" y="366" font-size="13" fill="#3C3C43" fill-opacity="0.6">November budget</text>
      <text x="122" y="392" font-size="22" font-weight="700" fill="#000">$41.80 left</text>
      <text x="122" y="414" font-size="13" fill="#3C3C43" fill-opacity="0.6">9 days to go</text>
    </g>
  </g>
</svg>
