\* MODULE: ConfirmAlerts
\* EXPECT: pass
\* The code with a Premium rollover run (V11-P3): the limit is the budget plus last period's
\* unspent amount. Three receipts this period and one late receipt dated last period, in any
\* interleaving, one rollback. The late receipt cuts this period's limit from 4 to 3, which
\* moves 3 units from 75% to 100%: check_thresholds checks this period for it, under the lock.
SPECIFICATION Spec
CONSTANTS
    Receipts = {r1, r2, r3}
    PriorReceipts = {p1}
    Budget = 2
    Thresholds = {50, 80, 100}
    Rollover = TRUE
    PriorChecksCurrent = TRUE
    UniqueLedger = TRUE
    BudgetRowLock = TRUE
    MaxAborts = 1
INVARIANTS TypeOK OneAlertPerThreshold NoMissedAlert
