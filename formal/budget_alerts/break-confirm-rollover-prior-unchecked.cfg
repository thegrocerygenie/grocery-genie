\* MODULE: ConfirmAlerts
\* EXPECT: violation NoMissedAlert
\* Broken variant: under a rollover run, a receipt dated last period checks only its own
\* (past) period, as check_thresholds did before V11-P3 (M5 drops past periods). It shrinks
\* this period's limit, so this period's spend reaches thresholds nobody alerts.
SPECIFICATION Spec
CONSTANTS
    Receipts = {r1, r2, r3}
    PriorReceipts = {p1}
    Budget = 2
    Thresholds = {50, 80, 100}
    Rollover = TRUE
    PriorChecksCurrent = FALSE
    UniqueLedger = TRUE
    BudgetRowLock = TRUE
    MaxAborts = 1
INVARIANTS TypeOK NoMissedAlert
