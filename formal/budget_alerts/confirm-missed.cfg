\* MODULE: ConfirmAlerts
\* EXPECT: pass
\* Finding H1 (found and fixed 2026-10-26): two confirms in flight together each read spend
\* without the other's receipt, so the threshold their sum crosses never alerted. The fix
\* locks the user's budget rows (FOR UPDATE) in check_thresholds before the spend read, so
\* the second confirm waits and reads both receipts. break-confirm-no-rowlock.cfg is the
\* same setup without the lock, and still finds the trace.
SPECIFICATION Spec
CONSTANTS
    Receipts = {r1, r2}
    Budget = 2
    Thresholds = {50, 100}
    UniqueLedger = TRUE
    BudgetRowLock = TRUE
    MaxAborts = 1
INVARIANTS TypeOK NoMissedAlert
