\* MODULE: ConfirmAlerts
\* EXPECT: violation NoMissedAlert
\* Finding H1 (2026-10-26): two confirms in flight together each read spend without the
\* other's receipt, so the threshold their sum crosses never alerts. Change EXPECT to pass
\* only after a code change that serializes the spend read (see confirm-fix-rowlock.cfg).
SPECIFICATION Spec
CONSTANTS
    Receipts = {r1, r2}
    Budget = 2
    Thresholds = {50, 100}
    UniqueLedger = TRUE
    BudgetRowLock = FALSE
    MaxAborts = 1
INVARIANTS TypeOK NoMissedAlert
