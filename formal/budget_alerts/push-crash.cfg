\* MODULE: PushDelivery
\* EXPECT: pass
\* Finding H2 (2026-10-26), fixed: one fault (a worker crash or failed commit, or Expo delivering
\* but the response timing out) after the send used to leave the row pending, so the next run
\* sent it again. The claim commits rows as sending before the POST, and an unknown outcome
\* ends as failed. Regression guards: break-push-retry-unknown, repro/h2_push_resend.py.
SPECIFICATION Spec
CONSTANTS
    Notifs = {n1, n2}
    Workers = {w1, w2}
    BatchSize = 2
    ChunkSize = 2
    RowLock = "skip_locked"
    Expiry = TRUE
    UnknownOutcome = "failed"
    KeepChunks = TRUE
    MaxFaults = 1
INVARIANTS TypeOK PushAtMostOnce
PROPERTIES EveryPushSettles
