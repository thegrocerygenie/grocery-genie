\* MODULE: PushDelivery
\* EXPECT: violation PushAtMostOnce
\* Broken variant: a chunk whose outcome is unknown (Expo delivered, then the response was
\* lost) goes back to pending instead of failed, so the next run sends it again (finding H2).
SPECIFICATION Spec
CONSTANTS
    Notifs = {n1, n2}
    Workers = {w1, w2}
    BatchSize = 2
    ChunkSize = 2
    RowLock = "skip_locked"
    Expiry = TRUE
    UnknownOutcome = "retry"
    KeepChunks = TRUE
    MaxFaults = 1
INVARIANTS TypeOK PushAtMostOnce
