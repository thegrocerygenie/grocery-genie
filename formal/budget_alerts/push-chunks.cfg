\* MODULE: PushDelivery
\* EXPECT: pass
\* Finding H2b (2026-10-26), fixed: with no fault at all, a batch that needs two Expo requests
\* (more than 100 messages, e.g. users with several devices) used to resend the first chunk
\* when the second request failed. Each chunk's tickets are now committed before the next
\* request. ChunkSize 1 < BatchSize 2 stands for that. Regression guards:
\* break-push-drop-chunks, repro/h2_push_resend.py.
SPECIFICATION Spec
CONSTANTS
    Notifs = {n1, n2}
    Workers = {w1}
    BatchSize = 2
    ChunkSize = 1
    RowLock = "skip_locked"
    Expiry = TRUE
    UnknownOutcome = "failed"
    KeepChunks = TRUE
    MaxFaults = 0
INVARIANTS TypeOK PushAtMostOnce
PROPERTIES EveryPushSettles
