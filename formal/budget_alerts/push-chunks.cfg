\* MODULE: PushDelivery
\* EXPECT: violation PushAtMostOnce
\* Finding H2b (2026-10-26): with no fault at all, a batch that needs two Expo requests
\* (more than 100 messages, e.g. users with several devices) resends the first chunk when
\* the second request fails. ChunkSize 1 < BatchSize 2 stands for that.
SPECIFICATION Spec
CONSTANTS
    Notifs = {n1, n2}
    Workers = {w1}
    BatchSize = 2
    ChunkSize = 1
    RowLock = "skip_locked"
    Expiry = TRUE
    MaxFaults = 0
INVARIANTS TypeOK PushAtMostOnce
